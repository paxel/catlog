name: catlog
description: "cat(a)log — a local-first catalog of foster cats: Clowders, Cats, dated field history, and shareable Cards."
publish_to: 'none'

# App version. Keep in sync with CHANGELOG.md.
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  catalog_core:
    path: packages/catalog_core
  cupertino_icons: ^1.0.8
  file_picker: ^10.3.0
  flutter_map: ^8.1.1
  geolocator: ^13.0.1
  latlong2: ^0.9.1
  package_info_plus: ^8.0.2
  image_picker: ^1.1.2
  intl: any
  path_provider: ^2.1.4
  mobile_scanner: ^7.0.0
  pdf: ^3.11.1
  printing: ^5.13.2
  qr_flutter: ^4.1.0
  share_plus: ^10.1.0
  url_launcher: ^6.3.0
  sqlite3_flutter_libs: ^0.5.24
  media_store_plus: ^0.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^6.0.0
  image: ^4.2.0

flutter:
  uses-material-design: true
  generate: true
