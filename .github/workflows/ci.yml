name: CI

on:
  push:
    branches: [main, summer]
  pull_request:

jobs:
  test:
    name: Analyze & test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install sqlite3 for pure-Dart core tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Core — analyze and test
        working-directory: packages/catalog_core
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test
      - name: App — analyze and test
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test

  apk:
    name: Android APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Write signing config from secrets
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=catlog
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EOF
      - run: flutter pub get
      - run: flutter build apk --release --build-number=$((GITHUB_RUN_NUMBER + 100))
      - uses: actions/upload-artifact@v6
        with:
          name: catlog-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  ios-build:
    name: iOS build (unsigned)
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
