# The one Android/store pipeline. A release-branch push builds ONLY the
# signed Play bundle for internal testing; a tag (or the manual dispatch
# button) additionally runs the gate and everything below. One workflow
# means one run counter, so version codes from internal and release
# builds can never collide (#39).
#
#   gate           — full Linux gate, tags only (analyze fatal-infos, all tests,
#                    the Rust desktop's tests, tag = pubspec = Cargo versions)
#   build-android  — signed per-ABI + universal APKs
#   build-linux    — Rust desktop: tar.gz, .deb and AppImage per arch
#   build-windows  — Rust desktop: zip with catlog.exe
#   build-macos    — Rust desktop: unsigned catlog.app in a .dmg, per arch
#   render-channels — Homebrew cask + formula and Scoop manifest rendered from
#                    the artifacts, uploaded as an artifact on every run
#   release        — GitHub Release, notes = the CHANGELOG section for the tag
#   channels       — the rendered files pushed to the tap and the bucket, after
#                    the Release, when publishing
#
# Publishing (Play, F-Droid, the Release, the tap and the bucket) happens
# on a tag, or on a manual dispatch that says publish=true. A dispatch
# without it is the dry run: every artifact is built and uploaded, nothing
# leaves GitHub.
#
# One-time setup (repository secrets):
#   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD — upload keystore
#   CHANNEL_PAT — PAT with push access to paxel/homebrew-tap and
#                 paxel/scoop-bucket (shared with dedup-rs)
name: Release

on:
  push:
    branches: ["release/**"]
    tags: ["v*"]
  # Releasing from the Actions UI: Run workflow → type the tag. `gh release
  # create` makes the tag at HEAD when it doesn't exist yet, so the button
  # alone can cut a release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
      publish:
        description: "Publish (release, Play, F-Droid, tap, bucket); off = dry run"
        type: boolean
        default: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # Every publishing step asks this; the artifacts are built regardless.
  PUBLISH: ${{ github.ref_type == 'tag' || github.event.inputs.publish == 'true' }}

jobs:
  gate:
    name: Gate (Linux, full)
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install sqlite3 for pure-Dart core tests
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Tag, pubspec version and Cargo version agree
        run: |
          ver=$(grep -m1 '^version:' pubspec.yaml | sed -E 's/version: *//; s/\+.*//')
          cargo_ver=$(grep -m1 '^version = ' desktop/Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          tag=${RELEASE_TAG#v}
          [ "$ver" = "$tag" ] || { echo "tag v$tag != pubspec version $ver" >&2; exit 1; }
          [ "$cargo_ver" = "$tag" ] || { echo "tag v$tag != Cargo version $cargo_ver" >&2; exit 1; }
      - name: Core — analyze and test
        working-directory: packages/catalog_core
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test
      - name: App — analyze and test
        run: |
          flutter pub get
          flutter analyze --fatal-infos
          flutter test
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Desktop build dependencies
        run: sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config
      - name: Desktop — format, lint and test
        working-directory: desktop
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked

  # Runs on every branch push AND every tag — the gate blocks the
  # release-only jobs, not the internal-testing bundle.
  build-android:
    name: Android APKs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Write signing config from secrets
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          cat > android/key.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=catlog
          keyPassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          EOF
      - run: flutter pub get
      # $GITHUB_RUN_NUMBER of THIS workflow is the only version-code
      # source. The +100 floors it above the codes burned while two
      # workflows still had counters of their own (#39).
      - name: Build the Play app bundle
        run: flutter build appbundle --release --build-number=$((GITHUB_RUN_NUMBER + 100))
      - name: Upload internal-testing bundle
        if: github.ref_type == 'branch' && github.event_name == 'push'
        uses: actions/upload-artifact@v6
        with:
          name: catlog-aab
          path: build/app/outputs/bundle/release/app-release.aab
      - name: Build release APKs
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: |
          flutter build apk --release --split-per-abi --build-number=$((GITHUB_RUN_NUMBER + 100))
          flutter build apk --release --build-number=$((GITHUB_RUN_NUMBER + 100))
      - name: Rename artifacts
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        run: |
          v="${RELEASE_TAG#v}"
          d=build/app/outputs/flutter-apk
          mkdir -p dist
          mv "$d/app-arm64-v8a-release.apk"   "dist/catlog-$v-android-arm64-v8a.apk"
          mv "$d/app-armeabi-v7a-release.apk" "dist/catlog-$v-android-armeabi-v7a.apk"
          mv "$d/app-x86_64-release.apk"      "dist/catlog-$v-android-x86_64.apk"
          mv "$d/app-release.apk"             "dist/catlog-$v-android-universal.apk"
          mv build/app/outputs/bundle/release/app-release.aab "dist/catlog-$v-android-playstore.aab"
      - uses: actions/upload-artifact@v6
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        with:
          name: android
          path: dist/*
      # The tag ships Android too, the way it ships Homebrew and Scoop.
      # `status: completed` is the whole point: `draft` parks the release
      # in the Console and waits for a human to press Start rollout.
      - name: Publish to Google Play
        if: env.PUBLISH == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.paxel.catlog
          # Glob, not the tag: the file is named without the leading "v"
          # and a `with:` value cannot strip it.
          releaseFiles: dist/*-android-playstore.aab
          # Internal testing only. Promoting to closed testing is a
          # decision, taken in the Console after the build was tried.
          track: internal
          status: completed

  build-linux:
    name: Linux desktop (${{ matrix.arch }})
    needs: gate
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev pkg-config curl
      - name: Build
        working-directory: desktop
        run: cargo build --release --locked --bin catlog
      - name: Pack tar.gz, .deb and AppImage
        run: |
          v="${RELEASE_TAG#v}"
          desktop/packaging/linux/pack.sh "$v" "${{ matrix.arch }}" desktop/target/release/catlog dist
      - uses: actions/upload-artifact@v6
        with:
          name: linux-${{ matrix.arch }}
          path: dist/*

  build-windows:
    name: Windows desktop
    needs: gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Build
        working-directory: desktop
        run: cargo build --release --locked --bin catlog
      - name: Pack
        shell: pwsh
        run: |
          $v = $env:RELEASE_TAG.TrimStart("v")
          desktop\packaging\windows\pack.ps1 -Version $v -Binary desktop\target\release\catlog.exe -Dist dist
      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: dist/*

  build-macos:
    name: macOS desktop (${{ matrix.arch }})
    needs: gate
    strategy:
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          # Last Intel image GitHub offers; when it retires, switch the
          # x86_64 artifact to a cross-compile from the arm64 runner.
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Build
        working-directory: desktop
        run: cargo build --release --locked --bin catlog
      - name: App bundle into dmg (unsigned)
        run: |
          v="${RELEASE_TAG#v}"
          desktop/packaging/macos/pack.sh "$v" "${{ matrix.arch }}" desktop/target/release/catlog dist
      - uses: actions/upload-artifact@v6
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*

  fdroid:
    name: F-Droid repo
    needs: [gate, build-android]
    if: github.ref_type == 'tag' || github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      # Channel-repo pattern like Homebrew/Scoop: the index and APK live
      # in paxel/fdroid (own Pages), not in this repo's history.
      - uses: actions/download-artifact@v7
        with:
          name: android
          path: apks
      - name: Install fdroidserver
        run: pip install --quiet fdroidserver
      - name: Publish to the channel repo
        env:
          GH_TOKEN: ${{ secrets.CHANNEL_PAT }}
          KEYSTORE_B64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.FDROID_KEYSTORE_PASS }}
        run: |
          v="${RELEASE_TAG#v}"
          git config --global user.name "catlog-release-bot"
          git config --global user.email "taum@tuta.io"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/paxel/fdroid.git" channel
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fdroid.p12"
          cd channel
          mkdir -p repo
          # Only the latest release stays in the repo; clients that lag
          # simply get the newest version, and Pages stays small.
          rm -f repo/*.apk
          cp "$GITHUB_WORKSPACE/apks/catlog-$v-android-arm64-v8a.apk" \
             "$GITHUB_WORKSPACE/apks/catlog-$v-android-armeabi-v7a.apk" repo/
          cat > config.yml <<EOF
          repo_url: https://paxel.github.io/fdroid/repo
          repo_name: cat(a)log
          repo_description: Releases of cat(a)log, the local-first catalog for people fostering cats.
          repo_keyalias: repokey
          keystore: $RUNNER_TEMP/fdroid.p12
          keystorepass: $KEYSTORE_PASS
          keypass: $KEYSTORE_PASS
          archive_older: 0
          EOF
          fdroid update --create-metadata
          rm config.yml
          git add -A
          git commit -m "catlog $v"
          git push

  release:
    name: GitHub Release
    needs: [gate, build-android, build-linux, build-windows, build-macos]
    if: github.ref_type == 'tag' || github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from the CHANGELOG section
        run: |
          ver=${RELEASE_TAG#v}
          awk -v ver="$ver" '
            $0 ~ "^## \\[" ver "\\]" { grab = 1; next }
            grab && (/^## \[/ || /^---/) { exit }
            grab { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $ver." > notes.md
      - name: Create release (idempotent — a rerun updates instead of dying)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "cat(a)log $RELEASE_TAG" --notes-file notes.md
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" \
              --title "cat(a)log $RELEASE_TAG" \
              --notes-file notes.md \
              dist/*
          fi

  render-channels:
    name: Render cask, formula and manifest
    needs: [gate, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Render from the templates with the artifacts' checksums
        run: desktop/packaging/render-channels.sh "${RELEASE_TAG#v}" dist out
      - uses: actions/upload-artifact@v6
        with:
          name: channels
          path: out/*

  # Only after the Release exists: the cask and the manifest point at its
  # assets, so nothing may be pushed before they are there.
  channels:
    name: Homebrew tap + Scoop bucket
    needs: [release, render-channels]
    if: github.ref_type == 'tag' || github.event.inputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: channels
          path: out
      - name: Push to the tap
        env:
          GH_TOKEN: ${{ secrets.CHANNEL_PAT }}
        run: |
          ver=${RELEASE_TAG#v}
          git config --global user.name "catlog-release-bot"
          git config --global user.email "taum@tuta.io"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/paxel/homebrew-tap.git" tap
          mkdir -p tap/Casks tap/Formula
          cp out/catlog-cask.rb tap/Casks/catlog.rb
          cp out/catlog-formula.rb tap/Formula/catlog.rb
          git -C tap add Casks/catlog.rb Formula/catlog.rb
          git -C tap commit -m "catlog $ver"
          git -C tap push
      - name: Push to the bucket
        env:
          GH_TOKEN: ${{ secrets.CHANNEL_PAT }}
        run: |
          ver=${RELEASE_TAG#v}
          git clone "https://x-access-token:${GH_TOKEN}@github.com/paxel/scoop-bucket.git" bucket
          mkdir -p bucket/bucket
          cp out/catlog.json bucket/bucket/catlog.json
          git -C bucket add bucket/catlog.json
          git -C bucket commit -m "catlog $ver"
          git -C bucket push
