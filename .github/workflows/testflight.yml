# Signed iOS build, uploaded to TestFlight (ADR-0003: no local Mac).
#
# Requires these repository secrets (see docs/ci-ios-signing.md):
#   IOS_CERTIFICATE_BASE64   distribution certificate (.p12, base64)
#   IOS_CERTIFICATE_PASSWORD password of that .p12
#   IOS_PROFILE_BASE64       App Store provisioning profile (base64)
#   APPSTORE_ISSUER_ID       App Store Connect API issuer id
#   APPSTORE_KEY_ID          App Store Connect API key id
#   APPSTORE_PRIVATE_KEY     App Store Connect API private key (.p8 contents)

name: TestFlight

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  testflight:
    name: Build, sign, upload
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Import signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      - name: Install provisioning profile
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.IOS_PROFILE_BASE64 }}" | base64 --decode \
            > ~/Library/MobileDevice/Provisioning\ Profiles/catlog.mobileprovision
      - run: flutter pub get
      - name: Build signed IPA
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: build/ios/ipa/catlog.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}
