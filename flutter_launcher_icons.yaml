# App icon generation: dart run flutter_launcher_icons
# Source of truth is assets/icon/icon_source.jpg; the PNGs are built from
# it by tool/icon_from_raster.dart (see assets/icon/README.md).
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  # The picture's own orange, sampled by the tool.
  adaptive_icon_background: "#FD5700"
  adaptive_icon_foreground: assets/icon/icon_fg.png
  # The foreground already places the artwork inside the launcher's
  # circle; the package's default 16% inset on top of it is what made the
  # cats a speck in the ring.
  adaptive_icon_foreground_inset: 0
  ios: true
  remove_alpha_ios: true
  windows:
    generate: true
  macos:
    generate: true
